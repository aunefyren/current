[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["dev"]
log_level = "WARNING"
log_cli_level = "WARNING"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "ASYNC",
    "D",    # docstrings, as Home Assistant requires
]
ignore = [
    "D202",  # no blank lines after docstring, conflicts with formatting
    "D203",
    "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
